<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .t{font-size:13px;fill:#334155}
      .b{font-size:15px;font-weight:600;fill:#0f172a}
      .h{font-size:19px;font-weight:700;fill:#fff}
      .f{font-size:13px;font-family:Consolas,Menlo,monospace;fill:#fff;opacity:.92}
      .card{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}
      .lbl{font-size:13px;font-weight:600;fill:#334155}
      .mono{font-family:Consolas,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="860" rx="18" fill="#f8fafc"/>
  <text x="40" y="50" font-size="26" font-weight="800" fill="#0f172a">PX4 Trajectory Studio · system architecture</text>
  <text x="40" y="76" class="t">Each panel is a folder in this repository. Solid arrows run while you use the Studio; dashed arrows run offline to calibrate it.</text>

  <!-- Browser -->
  <g filter="url(#s)"><rect x="40" y="100" width="420" height="430" rx="14" fill="#fff" stroke="#c4b5fd" stroke-width="2"/></g>
  <path d="M40 114 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v52 h-420 z" fill="#7c3aed"/>
  <text x="60" y="132" class="h">① Browser</text><text x="60" y="148" class="f">studio-v2/  ·  React + TypeScript</text>
  <g><rect x="64" y="176" width="372" height="92" rx="10" class="card"/>
    <text x="82" y="202" class="b">🗺️  Studio UI</text>
    <text x="82" y="224" class="t">Draw or type waypoints · 3D flight preview</text>
    <text x="82" y="244" class="t">Checks, charts, studies, flight comparison</text></g>
  <g><rect x="64" y="282" width="372" height="104" rx="10" class="card"/>
    <text x="82" y="308" class="b">🎯  Accuracy model  <tspan class="mono" font-size="12" font-weight="400" fill="#64748b">fidelity.ts</tspan></text>
    <text x="82" y="330" class="t">95% corridor around the route</text>
    <text x="82" y="350" class="t">Calibrated / Extrapolating / Uncalibrated badge</text>
    <text x="82" y="370" class="t">GNSS-outage drift what-if</text></g>
  <g><rect x="64" y="400" width="372" height="104" rx="10" class="card"/>
    <text x="82" y="426" class="b">🌬️  Live conditions</text>
    <text x="82" y="448" class="t">Wind at flight altitude (log law)</text>
    <text x="82" y="468" class="t">Dryden turbulence · forecast error</text>
    <text x="82" y="488" class="t">Density altitude · animated wind</text></g>

  <!-- Server -->
  <g filter="url(#s)"><rect x="530" y="100" width="380" height="430" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/></g>
  <path d="M530 114 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v52 h-380 z" fill="#2563eb"/>
  <text x="550" y="132" class="h">② Local Python server</text><text x="550" y="148" class="f">mission_planner/  ·  127.0.0.1:8767</text>
  <g><rect x="554" y="176" width="332" height="62" rx="10" class="card"/>
    <text x="572" y="202" class="b">HTTP API</text><text x="572" y="224" class="t mono">research_studio.py</text></g>
  <g><rect x="554" y="252" width="332" height="70" rx="10" class="card"/>
    <text x="572" y="278" class="b">✏️  Planner</text><text x="572" y="300" class="t">Quintic B-spline + speed/accel/jerk time law</text></g>
  <g><rect x="554" y="336" width="332" height="70" rx="10" class="card"/>
    <text x="572" y="362" class="b">✅  Independent verifier</text><text x="572" y="384" class="t">Re-checks limits, tube and stops</text></g>
  <g><rect x="554" y="420" width="332" height="84" rx="10" class="card"/>
    <text x="572" y="446" class="b">🔒  Plan artifact + study queue</text><text x="572" y="468" class="t">SHA-256 bound, marked SITL_ONLY</text><text x="572" y="488" class="t">Background speed / wind studies</text></g>
  <line x1="720" y1="238" x2="720" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="322" x2="720" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="406" x2="720" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Simulation -->
  <g filter="url(#s)"><rect x="980" y="100" width="380" height="430" rx="14" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
  <path d="M980 114 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v52 h-380 z" fill="#ea580c"/>
  <text x="1000" y="132" class="h">③ Simulation (optional)</text><text x="1000" y="148" class="f">controller/  ·  Linux or WSL2</text>
  <g><rect x="1004" y="176" width="332" height="84" rx="10" class="card"/>
    <text x="1022" y="202" class="b">🛰️  Offboard runner</text><text x="1022" y="224" class="t">pymavlink, 20 Hz setpoints</text><text x="1022" y="244" class="t">Takeoff → route → return → land</text></g>
  <g><rect x="1004" y="290" width="332" height="62" rx="10" class="card"/>
    <text x="1022" y="316" class="b">PX4 v1.17 SITL</text><text x="1022" y="338" class="t">Real autopilot code, real failsafes</text></g>
  <g><rect x="1004" y="382" width="332" height="84" rx="10" class="card"/>
    <text x="1022" y="408" class="b">🌍  Gazebo 8.15</text><text x="1022" y="430" class="t">Holybro X500 V2: stock x500 or</text><text x="1022" y="450" class="t">x500_cal (recalibrated from real flights)</text></g>
  <line x1="1170" y1="262" x2="1170" y2="288" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1180" y="280" class="t">MAVLink</text>
  <line x1="1170" y1="354" x2="1170" y2="380" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="1004" y="478" width="332" height="34" rx="8" fill="#fff7ed"/>
  <text x="1022" y="500" class="t">📈 Plan vs simulated flight report</text>

  <!-- flows between panels -->
  <line x1="438" y1="215" x2="550" y2="207" stroke="#475569" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="456" y="198" class="lbl">route · plan</text>
  <path d="M888 462 C 940 462, 940 218, 1000 218" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="916" y="350" class="lbl" transform="rotate(-90 930 350)">verified plan</text>

  <!-- Data panel -->
  <g filter="url(#s)"><rect x="300" y="600" width="870" height="220" rx="14" fill="#fff" stroke="#6ee7b7" stroke-width="2"/></g>
  <path d="M300 614 a14 14 0 0 1 14 -14 h842 a14 14 0 0 1 14 14 v52 h-870 z" fill="#059669"/>
  <text x="320" y="632" class="h">④ Public flight data (offline calibration)</text><text x="320" y="648" class="f">fidelity/  +  scripts/  →  validation/  →  config/fidelity/*.json</text>
  <g><rect x="324" y="676" width="250" height="122" rx="10" class="card"/>
    <text x="340" y="702" class="b">PX4 Flight Review</text><text x="340" y="724" class="t">Real Holybro X500 V2 logs</text><text x="340" y="744" class="t">27 aircraft, Offboard flights</text><text x="340" y="764" class="t">Deduplicated, quality-gated</text></g>
  <g><rect x="590" y="676" width="250" height="122" rx="10" class="card"/>
    <text x="606" y="702" class="b">CMU M100 dataset</text><text x="606" y="724" class="t">196 flights with an onboard</text><text x="606" y="744" class="t">anemometer: measured wind</text><text x="606" y="764" class="t">for drag + gust response</text></g>
  <g><rect x="856" y="676" width="290" height="122" rx="10" class="card"/>
    <text x="872" y="702" class="b">Fit · score · publish</text><text x="872" y="724" class="t">Split by aircraft (5 folds)</text><text x="872" y="744" class="t">Closed-loop tracking model</text><text x="872" y="764" class="t">95% envelopes, held-out coverage</text><text x="872" y="784" class="t">NanoBench + SITL replay checks</text></g>
  <path d="M449 798 V810 H1000 V800" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="840" y1="737" x2="854" y2="737" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Weather -->
  <g filter="url(#s)"><rect x="40" y="600" width="230" height="220" rx="14" fill="#fff" stroke="#7dd3fc" stroke-width="2"/></g>
  <path d="M40 614 a14 14 0 0 1 14 -14 h202 a14 14 0 0 1 14 14 v52 h-230 z" fill="#0284c7"/>
  <text x="58" y="632" class="h">☁️ Live weather</text><text x="58" y="648" class="f">free, no API key</text>
  <text x="58" y="694" class="b">Open-Meteo</text><text x="58" y="714" class="t">forecast + current wind</text>
  <text x="58" y="748" class="b">NOAA / NWS</text><text x="58" y="768" class="t">nearest measured station</text>
  <text x="58" y="800" class="t" fill="#64748b">(US locations)</text>
  <line x1="155" y1="598" x2="155" y2="534" stroke="#0284c7" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="165" y="572" class="lbl" fill="#0369a1">HTTPS</text>
  <path d="M380 598 V534" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="392" y="572" class="lbl" fill="#047857">x500_envelope.json · x500_evidence.json</text>
  <path d="M1170 650 H1250 V534" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="1185" y="680" class="lbl" fill="#047857">real PX4 tuning</text><text x="1185" y="698" class="lbl" fill="#047857">x500_cal model</text>
</svg>
