<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="1400" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>.n{font-size:34px}.b{font-size:16px;font-weight:700;fill:#0f172a}.t{font-size:13px;fill:#475569}.k{font-size:12px;font-weight:700;fill:#fff}</style>
  </defs>
  <rect width="1400" height="380" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" font-size="24" font-weight="800" fill="#0f172a">From a drawing to a flight</text>
  <text x="40" y="70" font-size="13" fill="#475569">Steps 1-4 run on your laptop every time you press Check route. Steps 5-6 need the optional PX4 + Gazebo setup.</text>

  <g id="steps">
    <g filter="url(#s)"><rect x="40" y="100" width="190" height="170" rx="14" fill="#fff" stroke="#c4b5fd" stroke-width="2"/></g>
    <circle cx="70" cy="130" r="15" fill="#7c3aed"/><text x="70" y="135" class="k" text-anchor="middle">1</text>
    <text x="196" y="142" class="n" text-anchor="end">✏️</text>
    <text x="58" y="182" class="b">Draw</text><text x="58" y="206" class="t">Click points, type a</text><text x="58" y="224" class="t">table, or load an</text><text x="58" y="242" class="t">example route</text>

    <g filter="url(#s)"><rect x="265" y="100" width="190" height="170" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/></g>
    <circle cx="295" cy="130" r="15" fill="#2563eb"/><text x="295" y="135" class="k" text-anchor="middle">2</text>
    <text x="421" y="142" class="n" text-anchor="end">〰️</text>
    <text x="283" y="182" class="b">Smooth</text><text x="283" y="206" class="t">Quintic B-spline that</text><text x="283" y="224" class="t">stays inside your</text><text x="283" y="242" class="t">deviation tube</text>

    <g filter="url(#s)"><rect x="490" y="100" width="190" height="170" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="2"/></g>
    <circle cx="520" cy="130" r="15" fill="#2563eb"/><text x="520" y="135" class="k" text-anchor="middle">3</text>
    <text x="646" y="142" class="n" text-anchor="end">⏱️</text>
    <text x="508" y="182" class="b">Time</text><text x="508" y="206" class="t">Speed, acceleration</text><text x="508" y="224" class="t">and jerk limits of</text><text x="508" y="242" class="t">the X500 profile</text>

    <g filter="url(#s)"><rect x="715" y="100" width="190" height="170" rx="14" fill="#fff" stroke="#86efac" stroke-width="2"/></g>
    <circle cx="745" cy="130" r="15" fill="#16a34a"/><text x="745" y="135" class="k" text-anchor="middle">4</text>
    <text x="871" y="142" class="n" text-anchor="end">✅</text>
    <text x="733" y="182" class="b">Verify</text><text x="733" y="206" class="t">A separate checker</text><text x="733" y="224" class="t">re-tests every limit,</text><text x="733" y="242" class="t">then locks the plan</text>

    <g filter="url(#s)"><rect x="940" y="100" width="190" height="170" rx="14" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
    <circle cx="970" cy="130" r="15" fill="#ea580c"/><text x="970" y="135" class="k" text-anchor="middle">5</text>
    <text x="1096" y="142" class="n" text-anchor="end">🛩️</text>
    <text x="958" y="182" class="b">Fly in SITL</text><text x="958" y="206" class="t">Offboard runner flies</text><text x="958" y="224" class="t">it in PX4 + Gazebo</text><text x="958" y="242" class="t">(takeoff → land)</text>

    <g filter="url(#s)"><rect x="1165" y="100" width="195" height="170" rx="14" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
    <circle cx="1195" cy="130" r="15" fill="#ea580c"/><text x="1195" y="135" class="k" text-anchor="middle">6</text>
    <text x="1326" y="142" class="n" text-anchor="end">📈</text>
    <text x="1183" y="182" class="b">Compare</text><text x="1183" y="206" class="t">Plan vs simulated</text><text x="1183" y="224" class="t">flight, error report</text><text x="1183" y="242" class="t">and CSV exports</text>
  </g>
  <g stroke="#475569" stroke-width="2.5" marker-end="url(#a)">
    <line x1="232" y1="185" x2="262" y2="185"/><line x1="457" y1="185" x2="487" y2="185"/><line x1="682" y1="185" x2="712" y2="185"/><line x1="907" y1="185" x2="937" y2="185"/><line x1="1132" y1="185" x2="1162" y2="185"/>
  </g>
  <path d="M810 272 V316 H380" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#r)"/>
  <rect x="40" y="296" width="330" height="58" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="320" font-size="14" font-weight="700" fill="#b91c1c">Fails a check?</text>
  <text x="56" y="341" font-size="13" fill="#7f1d1d">Studio says why and offers the closest safe speed.</text>
  <path d="M860 272 V325 H920" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 6"/>
  <rect x="925" y="296" width="435" height="58" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="941" y="320" font-size="14" font-weight="700" fill="#15803d">Locked plan artifact</text>
  <text x="941" y="341" font-size="13" fill="#14532d">SHA-256 fingerprint, SITL_ONLY: only this exact plan can fly.</text>
</svg>
