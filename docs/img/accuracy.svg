<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>.b{font-size:15px;font-weight:700;fill:#0f172a}.t{font-size:13px;fill:#475569}.big{font-size:30px;font-weight:800}.lane{font-size:13px;font-weight:800;letter-spacing:.06em}</style>
  </defs>
  <rect width="1400" height="470" rx="18" fill="#f8fafc"/>
  <text x="40" y="46" font-size="24" font-weight="800" fill="#0f172a">How the accuracy numbers are earned</text>
  <text x="40" y="70" font-size="13" fill="#475569">Three public datasets. Tracking is scored only on aircraft the model never saw. Results feed the corridor and badge in the Studio.</text>

  <!-- lane 1 -->
  <text x="40" y="112" class="lane" fill="#7c3aed">TRACKING · real Holybro X500 V2 (PX4 Flight Review)</text>
  <g filter="url(#s)"><rect x="40" y="122" width="250" height="84" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="56" y="148" class="b">27 aircraft · 194 min</text><text x="56" y="170" class="t">Offboard flights; 27 duplicate</text><text x="56" y="188" class="t">uploads removed by SHA-256</text>
  <g filter="url(#s)"><rect x="320" y="122" width="250" height="84" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="336" y="148" class="b">Split by aircraft</text><text x="336" y="170" class="t">5 folds: no drone is in both</text><text x="336" y="188" class="t">training and test</text>
  <g filter="url(#s)"><rect x="600" y="122" width="250" height="84" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="616" y="148" class="b">Closed-loop model</text><text x="616" y="170" class="t">2nd-order fit (ωn, ζ, delay) +</text><text x="616" y="188" class="t">conformal 95% envelope</text>
  <g filter="url(#s)"><rect x="880" y="122" width="480" height="84" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/></g>
  <text x="900" y="162" class="big" fill="#6d28d9">0.13 m</text><text x="900" y="188" class="t">median error (vs 0.22 m naive)</text>
  <text x="1120" y="162" class="big" fill="#6d28d9">±1.26 m</text><text x="1120" y="188" class="t">95% at 20 s, &lt;2 m/s · 99% held</text>

  <!-- lane 2 -->
  <text x="40" y="250" class="lane" fill="#059669">WIND · CMU DJI M100 with onboard anemometer</text>
  <g filter="url(#s)"><rect x="40" y="260" width="250" height="84" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="56" y="286" class="b">196 flights · 506 legs</text><text x="56" y="308" class="t">Measured airspeed and wind</text><text x="56" y="326" class="t">at 5 Hz</text>
  <g filter="url(#s)"><rect x="320" y="260" width="250" height="84" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="336" y="286" class="b">Drag vs airspeed</text><text x="336" y="308" class="t">R² 0.92 with measured airspeed</text><text x="336" y="326" class="t">vs 0.44 with ground speed</text>
  <g filter="url(#s)"><rect x="600" y="260" width="250" height="84" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="616" y="286" class="b">Gust response</text><text x="616" y="308" class="t">Cross-track vs measured</text><text x="616" y="326" class="t">crosswind turbulence σ</text>
  <g filter="url(#s)"><rect x="880" y="260" width="480" height="84" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/></g>
  <text x="900" y="300" class="big" fill="#047857">0.25 m</text><text x="900" y="326" class="t">extra p95 per m/s of gust σ</text>
  <text x="1120" y="300" class="big" fill="#047857">0.23 m</text><text x="1120" y="326" class="t">p95 route deviation</text>

  <!-- lane 3 -->
  <text x="40" y="388" class="lane" fill="#ea580c">SIM-TO-REAL · real setpoints replayed in PX4 SITL + Gazebo</text>
  <g filter="url(#s)"><rect x="40" y="398" width="530" height="56" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="56" y="422" class="b">30 real flight windows replayed</text><text x="56" y="442" class="t">default x500 tuning vs each aircraft's own PX4 tuning</text>
  <g filter="url(#s)"><rect x="600" y="398" width="250" height="56" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="616" y="422" class="b">Biggest gap: tuning</text><text x="616" y="442" class="t">not physics</text>
  <g filter="url(#s)"><rect x="880" y="398" width="480" height="56" rx="12" fill="#fff7ed" stroke="#fdba74"/></g>
  <text x="900" y="436" class="big" fill="#c2410c" font-size="26">3.1 m → 1.2 m</text><text x="1110" y="434" class="t">Gazebo p95 error with real tuning</text>

  <g stroke="#475569" stroke-width="2.5" marker-end="url(#a)">
    <line x1="292" y1="164" x2="318" y2="164"/><line x1="572" y1="164" x2="598" y2="164"/><line x1="852" y1="164" x2="878" y2="164"/>
    <line x1="292" y1="302" x2="318" y2="302"/><line x1="572" y1="302" x2="598" y2="302"/><line x1="852" y1="302" x2="878" y2="302"/>
    <line x1="572" y1="426" x2="598" y2="426"/><line x1="852" y1="426" x2="878" y2="426"/>
  </g>
</svg>
