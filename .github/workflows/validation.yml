name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks
        run: python -m ruff check controller analysis scripts tests trajectory_generator tools
      - name: Deterministic validation
        env:
          MPLBACKEND: Agg
        run: python scripts/validate.py
      - name: Connector subprocess regression tests
        run: python -m unittest discover -s tools/powershell_connector -p test_server.py -v
      - name: Critical logic branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=controller \
            -m unittest discover -s tests
          python -m coverage report --fail-under=80 \
            controller/PID_Controller.py \
            controller/minimum_jerk.py \
            controller/mission_config.py \
            controller/mission_state.py \
            controller/px4_policy.py \
            controller/run_record.py \
            controller/trajectory.py \
            controller/tracking_governor.py \
            controller/position_prediction.py \
            controller/touchdown_quality.py
